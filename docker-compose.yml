services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lexi_postgres
    environment:
      POSTGRES_USER: lexi
      POSTGRES_PASSWORD: lexi_secret
      POSTGRES_DB: lexipdf
    ports:
      - "5432:5432"
    volumes:
      - lexi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexi -d lexipdf"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: lexi_app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # docker-compose's internal network name, overriding whatever host is
      # in .env's DATABASE_URL (typically "localhost" for local dev).
      DATABASE_URL: postgresql://lexi:lexi_secret@postgres:5432/lexipdf
    ports:
      - "3000:3000"
    volumes:
      # Only load-bearing while STORAGE_PROVIDER=local (the only implemented
      # option today) — without this, every recreate loses uploaded PDFs.
      - lexi_uploads:/app/storage/uploads

volumes:
  lexi_pgdata:
  lexi_uploads:
